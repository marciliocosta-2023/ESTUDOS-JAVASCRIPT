<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            background-color: rgb(215, 228, 104);
            font-family: Arial, Helvetica, sans-serif;
            padding: 0;
            margin: 0;
        }

        h1 {
            text-align: center;
            font-weight: bold;
        }

        #caixa {
            background-color: white;
            margin: auto;
            padding: 20px;
            width: 450px;
            height: 300px;
            border-radius: 20px;
        }

        p#hora , p#foot {
            text-align: center;
        }

        #caixa > #circulo {
            border-radius: 200px;
            margin: auto;
            background-image: url(padrao.webp);
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            padding-top: 20px;
            width: 50%;
            height: 66%;
            margin-top: 30px;
        }

    </style>
    <title>Hora do Dia</title>
</head>
<body>
    <h1>Hora do Dia</h1>
    <div id="caixa">
        <p id="hora"></p>
        <div id="circulo"></div>
    </div>
    <p id="foot">@MarcilioDaCosta</p>

    <script>
        var agora = new Date()
        var hora = agora.getHours()
            if (hora < 12) {
                document.getElementById('hora').innerHTML = 'Agora são exatamente ' + hora + ' horas. <br> Tenha um ótimo dia!'
                document.body.style.backgroundColor = 'whitesmoke'
                document.getElementById('circulo').style.backgroundImage = 'url(manha.jpg)'
            } else if (hora < 18) {
                document.getElementById('hora').innerHTML = 'Agora são exatamente ' + hora + ' horas. <br> Tenha uma ótima tarde!'
                document.body.style.backgroundColor = 'lightblue'
                document.getElementById('circulo').style.backgroundImage = 'url(tarde.jpg)'
            } else {
                document.getElementById('hora').innerHTML = 'Agora são exatamente ' + hora + ' horas. <br> Tenha uma ótima noite!'
                document.body.style.backgroundColor = 'rgb(80, 80, 124)'
                document.getElementById('circulo').style.backgroundImage = 'url(noite.jpg)'
            }
    </script>
</body>
</html>
