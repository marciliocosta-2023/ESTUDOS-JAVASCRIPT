<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
            background-color: rgb(124, 154, 165);
        }

        body > h1 {
            text-align: center;
            color: rgb(245, 245, 245);
        }

        #caixa {
            margin: auto;
            padding: 20px;
            width: 400px;
            height: 360px;
            background-color: white;
        }

        #caixa > #resultado {
            text-align: center;
        }

        #foto {
            height: 200px;
            width: 200px;
            border-radius: 50%;
            margin: auto;
            background-image: url(idoso.jpg);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        
        #verificar {
            width: 100%;
            height: 30px;
            margin-bottom: 10px;
        }

        #verificar:hover {
            background-color: rgb(124, 154, 165);
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        footer {
            text-align: center;
            margin-top: 20px;
            color: white;
        }

        footer a {
            color: white;
            font-weight: bold;
            text-decoration: none;
        }

        footer a:hover {
            color: rgb(124, 154, 165);
            background-color: white;
            padding: 5px;
            border-radius: 5px;
        }

    </style>
    <title>Verificador de idade</title>
</head>
<body>
    <h1>Verificador de idade</h1>
    <div id="caixa">
        <label for="iano">Ano de nascimento:</label>
        <input type="text" name="iano" id="iano" placeholder="Digite seu ano de nascimento" maxlength="4">
        <br><br>
        
        <label for="isexo">Sexo:</label>
        <input type="radio" name="isexo" id="isexom" value="Masculino">
        <label for="isexom">Masculino</label>
        <input type="radio" name="isexo" id="isexof" value="Feminino">
        <label for="isexof">Feminino</label>
        <br><br>
        <input id="verificar" type="submit" value="Verificar" onclick="verificar()">

        <p id="resultado"></p>
        <div id="foto"></div>
    </div>


    <footer>
        <p> &copy; 2026 - Desenvolvido por <a href="https://www.linkedin.com/in/marcilio-da-costa-ramos-neto-396a15254/" target="_blank">Marcilio da Costa</a></p>
    </footer>

    <script>
        function verificar() {
            var anoAtual = new Date().getFullYear();
            var nascimento = document.getElementById('iano').value;
            var sexo = document.getElementsByName('isexo');
            var verificar = document.getElementById('verificar');
            var resultado = document.getElementById('resultado');

            if (nascimento <= 1970 && nascimento > 1920 && sexo[1].checked) {
                resultado.innerHTML = 'Você é uma mulher idosa. E sua idade é de ' + (anoAtual - nascimento) + ' anos.';
                document.getElementById('foto').style.backgroundImage = "url('idosamulher.jpg')"
            } else if (nascimento <= 1970 && nascimento > 1920 && sexo[0].checked) {
                resultado.innerHTML = 'Você é um Homem idoso. E sua idade é de ' + (anoAtual - nascimento) + ' anos.';
                document.getElementById('foto').style.backgroundImage = "url('idosohomem.jpg')"
         
            } else if (nascimento >= 1970 && nascimento < 2012 && sexo[1].checked) {
                resultado.innerHTML = 'Você é uma mulher adulta. E sua idade é de ' + (anoAtual - nascimento) + ' anos.';
                document.getElementById('foto').style.backgroundImage = "url('adultomulher.jpg')"
            } else if (nascimento >= 1970 && nascimento < 2012 && sexo[0].checked) {
                resultado.innerHTML = 'Você é um Homem adulto. E sua idade é de ' + (anoAtual - nascimento) + ' anos.';
                document.getElementById('foto').style.backgroundImage = "url('adultohomem.jpg')"
            } else if (nascimento >= 2012 && sexo[1].checked) {
                resultado.innerHTML = 'Você é uma menina. E sua idade é de ' + (anoAtual - nascimento) + ' anos.';
                document.getElementById('foto').style.backgroundImage = "url('criancamenina.jpg')"
            } else if (nascimento >= 2012 && sexo[0].checked) {
                resultado.innerHTML = 'Você é um menino. E sua idade é de ' + (anoAtual - nascimento) + ' anos.';
                document.getElementById('foto').style.backgroundImage = "url('criancamenino.jpg')"
            } else {
                resultado.innerHTML = 'Idade inválida.';
            }
        }
    </script>
</body>
</html>
