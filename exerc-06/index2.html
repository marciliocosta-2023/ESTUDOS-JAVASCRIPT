<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Somando numeros</title>
</head>
<body>
    <h1>Multiplicando valores</h1>
    <input type="number" name="txt1" id="txt1">
    <input type="number" name="txt2" id="txt2">
    <input type="button" value="Somar" id="btn" onclick="somar()">
    <div id="resultado">O resultado é: </div>

    <script>
        function somar() {
            var num1 = document.querySelector('#txt1');
            var num2 = document.querySelector('#txt2');
            var resultado = Number(num1.value) * Number(num2.value);
            document.querySelector('#resultado').innerText = "A multiplicacao é: " + resultado;
        }
    </script>
</body>
</html>
